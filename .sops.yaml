creation_rules:
  - path_regex: modules/nebula/ca\.key(\.crypt)?$
    key_groups:
    - age:
      - *fayad
      - *jrautiola
  - path_regex: modules/nebula/ca\.crt(\.crypt)?$
    key_groups:
    - age:
      - *fayad
      - *jrautiola
      - *seclab-lighthouse
      - *builder1
      - *nethsm-gateway
  - path_regex: hosts/lighthouse/secrets.yaml$
    key_groups:
    - age:
      - *seclab-lighthouse
      - *fayad
      - *jrautiola
  - path_regex: hosts/builder1/secrets.yaml$
    key_groups:
    - age:
      - *builder1
      - *fayad
      - *jrautiola
  - path_regex: hosts/nethsm-gateway/secrets.yaml$
    key_groups:
    - age:
      - *nethsm-gateway
      - *fayad
      - *jrautiola
